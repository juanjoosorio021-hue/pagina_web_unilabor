<!-- FILTROS -->
<div class="bg-white border-b border-gray-200 sticky top-16 z-40">
  <div class="max-w-6xl mx-auto px-4 py-3 flex gap-2 overflow-x-auto scrollbar-hide text-sm">
    <button onclick="filtrar(this,'todos')" class="filtro-btn whitespace-nowrap px-4 py-1.5 rounded-full border border-primary bg-primary text-white font-medium">Todos</button>
    <button onclick="filtrar(this,'cascos')" class="filtro-btn whitespace-nowrap px-4 py-1.5 rounded-full border border-gray-300 text-gray-600 font-medium hover:border-primary hover:text-primary">⛑️ Cascos</button>
    <button onclick="filtrar(this,'guantes')" class="filtro-btn whitespace-nowrap px-4 py-1.5 rounded-full border border-gray-300 text-gray-600 font-medium hover:border-primary hover:text-primary">🧤 Guantes</button>
    <button onclick="filtrar(this,'gafas')" class="filtro-btn whitespace-nowrap px-4 py-1.5 rounded-full border border-gray-300 text-gray-600 font-medium hover:border-primary hover:text-primary">🥽 Gafas</button>
    <button onclick="filtrar(this,'auditiva')" class="filtro-btn whitespace-nowrap px-4 py-1.5 rounded-full border border-gray-300 text-gray-600 font-medium hover:border-primary hover:text-primary">🔇 Auditiva</button>
    <button onclick="filtrar(this,'calzado')" class="filtro-btn whitespace-nowrap px-4 py-1.5 rounded-full border border-gray-300 text-gray-600 font-medium hover:border-primary hover:text-primary">🥾 Calzado</button>
    <button onclick="filtrar(this,'ropa')" class="filtro-btn whitespace-nowrap px-4 py-1.5 rounded-full border border-gray-300 text-gray-600 font-medium hover:border-primary hover:text-primary">🦺 Ropa</button>
    <button onclick="filtrar(this,'señalizacion')" class="filtro-btn whitespace-nowrap px-4 py-1.5 rounded-full border border-gray-300 text-gray-600 font-medium hover:border-primary hover:text-primary">🚧 Señalización</button>
    <button onclick="filtrar(this,'barreras')" class="filtro-btn whitespace-nowrap px-4 py-1.5 rounded-full border border-gray-300 text-gray-600 font-medium hover:border-primary hover:text-primary">🔶 Barreras</button>
  </div>
</div>

<!-- GRID PRODUCTOS -->
<main class="max-w-6xl mx-auto px-4 py-8">
  <div id="productos-grid" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 gap-4"></div>
</main>

<!-- PANEL CARRITO -->
<div id="carrito-overlay" onclick="cerrarCarrito()" class="fixed inset-0 bg-black/40 z-50" style="display:none"></div>
<div id="carrito-panel" class="carrito-cerrado fixed top-0 right-0 h-full w-80 bg-white shadow-2xl z-50 flex flex-col">
  <div class="flex items-center justify-between p-4 border-b border-gray-100">
    <h3 class="font-bold text-primary text-lg">Tu Cotización</h3>
    <button onclick="cerrarCarrito()" class="text-gray-400 hover:text-gray-700 text-xl font-bold">✕</button>
  </div>
  <div class="flex-1 overflow-y-auto px-4">
    <p id="carrito-empty" class="text-center text-gray-400 text-sm py-10">No hay productos aún.<br/>¡Agrega algo del catálogo!</p>
    <div id="carrito-lista"></div>
  </div>
  <div id="carrito-footer" class="p-4 border-t border-gray-100 flex flex-col gap-2" style="display:none">
    <button onclick="solicitarWhatsApp()" class="w-full bg-green-500 hover:bg-green-600 text-white font-bold py-3 rounded-xl text-sm transition">
      💬 Solicitar Cotización por WhatsApp
    </button>
    <button onclick="descargarPDF()" class="w-full bg-primary hover:bg-blue-900 text-white font-bold py-3 rounded-xl text-sm transition">
      📄 Descargar Resumen PDF
    </button>
    <button onclick="carrito=[];guardar();" class="w-full text-red-400 hover:text-red-600 text-xs py-1 transition">
      Vaciar carrito
    </button>
  </div>
</div>

let catActiva = 'todos';

function filtrar(btn, cat) {
  catActiva = cat;
  document.querySelectorAll('.filtro-btn').forEach(b => {
    b.classList.remove('bg-primary','text-white','border-primary');
    b.classList.add('border-gray-300','text-gray-600');
  });
  btn.classList.add('bg-primary','text-white','border-primary');
  btn.classList.remove('border-gray-300','text-gray-600');
  renderProductos();
}

function renderProductos() {
  const lista = catActiva === 'todos' ? PRODUCTOS : PRODUCTOS.filter(p => p.cat === catActiva);
  document.getElementById('productos-grid').innerHTML = lista.map(p => `
    <div class="card-hover bg-white rounded-2xl overflow-hidden shadow-sm border border-gray-100">
      <div class="bg-blue-50 h-32 flex items-center justify-center text-5xl">${p.emoji}</div>
      <div class="p-3">
        <p class="font-semibold text-primary text-sm leading-tight mb-1">${p.nombre}</p>
        <p class="text-xs text-gray-400 mb-3">$ ${p.precio.toLocaleString('es-CO')} c/u</p>
        <button onclick="agregarProducto('${p.id}','${p.nombre.replace(/'/g,"\\'")}',${p.precio})"
          class="w-full bg-primary hover:bg-blue-900 text-white text-xs font-bold py-2 rounded-xl transition">
          + Agregar
        </button>
      </div>
    </div>
  `).join('');
}

document.addEventListener('DOMContentLoaded', () => { renderProductos(); actualizarUI(); });

// Leer cat desde URL
const urlCat = new URLSearchParams(location.search).get('cat');
if (urlCat) { catActiva = urlCat; }
</script>
